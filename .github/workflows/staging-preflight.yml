name: Staging packaging preflight
on:
  push:
    branches: [staging]
    paths:
      - 'deploy/staging/**'
      - '.dockerignore'
      - '.github/workflows/staging-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compose-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLEANOPS_AUTH_ORIGIN: https://staging.invalid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate synthetic Compose-only secret
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          fixture="$(mktemp -d "$RUNNER_TEMP/cleanops-preflight.XXXXXX")"
          printf '%s\n' "$fixture" > "$RUNNER_TEMP/cleanops-fixture-path"
          printf 'synthetic-ci-only-not-a-deployment\n' > "$fixture/postgres-password"
          printf '{}\n' > "$fixture/server.json"
          mkdir "$fixture/tls"
          {
            printf 'CLEANOPS_COMPOSE_PROJECT=cleanops-offline-fixture\n'
            printf 'CLEANOPS_PRIVATE_NETWORK=cleanops-offline-network\n'
            printf 'CLEANOPS_PG_VOLUME=cleanops-offline-volume\n'
            printf 'CLEANOPS_PG_IMAGE=postgres:16-bookworm\n'
            printf 'CLEANOPS_PG_DATABASE=cleanops_offline\n'
            printf 'CLEANOPS_PG_BOOTSTRAP_USER=offline_bootstrap\n'
            printf 'CLEANOPS_PG_PASSWORD_FILE=%s\n' "$fixture/postgres-password"
            # Paths only for config/build: no certificate generation or PG startup.
            printf 'CLEANOPS_PG_TLS_CERT_FILE=%s\n' "$fixture/server.crt"
            printf 'CLEANOPS_PG_TLS_KEY_FILE=%s\n' "$fixture/server.key"
            printf 'CLEANOPS_PG_TLS_CA_FILE=%s\n' "$fixture/ca.crt"
            printf 'CLEANOPS_PG_HBA_FILE=%s\n' "$fixture/pg_hba.conf"
            printf 'CLEANOPS_PG_HBA_TARGET=/var/lib/postgresql/data/pg_hba.conf\n'
            printf 'CLEANOPS_BAO_CONFIG_FILE=%s\n' "$fixture/server.json"
            printf 'CLEANOPS_BAO_TLS_DIR=%s\n' "$fixture/tls"
            printf 'CLEANOPS_BAO_SUBNET=10.249.88.0/24\n'
            printf 'CLEANOPS_BAO_PRIVATE_IPV4=10.249.88.2\n'
            # Agent config paths only; this fixture never starts Agent or Bao.
            printf 'CLEANOPS_AGENT_IMAGE=cleanops-existing-agent-fixture:offline\n'
            printf 'CLEANOPS_AGENT_NETWORK=cleanops-existing-bao-network-fixture\n'
            printf 'CLEANOPS_IDENTITY_UID=1000\n'
            printf 'CLEANOPS_IDENTITY_GID=1000\n'
            printf 'CLEANOPS_AGENT_CONFIG_FILE=%s\n' "$fixture/agent.hcl"
            printf 'CLEANOPS_AGENT_TLS_DIR=%s\n' "$fixture/agent-tls"
          } >> "$GITHUB_ENV"
      - name: Validate syntax and isolation
        shell: bash
        run: |
          set -euo pipefail
          docker compose -f deploy/staging/compose.yaml config -q
          python3 scripts/staging-compose-check.py
      - name: Build Next.js application image without publishing
        run: docker compose -f deploy/staging/compose.yaml build web
      - name: Clean owned synthetic secret
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker="$RUNNER_TEMP/cleanops-fixture-path"
          if [ -f "$marker" ]; then
            fixture="$(cat "$marker")"
            case "$fixture" in
              "$RUNNER_TEMP"/cleanops-preflight.*) ;;
              *) echo 'Unexpected fixture path; refusing cleanup' >&2; exit 1 ;;
            esac
            test "$(dirname -- "$fixture")" = "$RUNNER_TEMP"
            test ! -L "$fixture"
            rm -rf -- "$fixture"
            rm -f -- "$marker"
          fi
