name: Staging B1 integration gate
on:
  push:
    branches: [staging]
    paths:
      - 'lib/b1/**'
      - 'tests/b1/**'
      - 'scripts/openbao-b1-integration.ts'
      - 'tests/static/test_b1_openbao_integration.py'
      - 'tests/static/test_b1_custody_harness_wiring.py'
      - '.github/workflows/staging-b1-integration.yml'
permissions:
  contents: read
jobs:
  isolated-b1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:b1
      - run: python3 -m unittest discover -s tests/static -p 'test_b1_openbao_integration.py' -v
      - run: python3 -m unittest discover -s tests/static -p 'test_b1_custody_harness_wiring.py' -v
      - run: python3 scripts/staging-compose-check.py
