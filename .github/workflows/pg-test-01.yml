name: PG-TEST-01 authorized isolated PostgreSQL
# Historical PATCH-01 harness only. No automatic PR SQL installation.
# The consolidated proposal is never selected by this workflow.
on:
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Historical isolated PG-TEST-01-PATCH-01 only; not consolidated SQL approval'
        required: true
        type: choice
        options:
          - PG-TEST-01-PATCH-01
permissions:
  contents: read
jobs:
  pg-test-01:
    if: github.ref == 'refs/heads/feat/b1-http-flows' && inputs.authorization == 'PG-TEST-01-PATCH-01'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorized exact-blob isolated validation
        run: python3 scripts/pg-test-01.py
      - name: Redacted PostgreSQL evidence
        if: always()
        run: |
          if [ -f artifacts/pg-test-01/report.json ]; then
            cat artifacts/pg-test-01/report.json
          fi
