name: B2 no database
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    if: github.head_ref == 'feat/b2-users-access'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Installed Next.js route and client guides
        run: |
          find node_modules/next/dist/docs -type f -iname '*route*' -o -iname '*client-component*'
          for guide in node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/route* node_modules/next/dist/docs/01-app/03-api-reference/01-directives/use-client*; do
            if test -f "$guide"; then cat "$guide"; fi
          done
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run test:b1
        if: ${{ !cancelled() }}
      - run: node --experimental-strip-types --test --test-isolation=none tests/b2/*.test.ts
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}
      - name: Install pinned Semgrep
        if: ${{ !cancelled() }}
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0
      - name: Semgrep on B2 and shared HTTP contracts
        if: ${{ !cancelled() }}
        run: semgrep scan --config .semgrep/cleanops-foundation.yml --error --disable-nosem --metrics=off lib/b2 lib/b1/contracts.ts lib/b1/v4-broker.ts
      - name: Gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.24.3'
