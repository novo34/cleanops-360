name: B2 no database
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    if: github.head_ref == 'feat/b2-users-access'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned PostgreSQL 16 grammar parser (no database)
        run: python scripts/install-pg16-parser.py
      - name: Parse prepared SQL without executing SQL or fixtures
        run: |
          python scripts/parse-b1-sql.py docs/proposals/b2-users/001-directory.review.sql
          python scripts/parse-b1-sql.py docs/proposals/b2-access/002-effective-access.review.sql
          python scripts/parse-b1-sql.py docs/proposals/b2-users/003-user-changes.review.sql
      - name: Installed Next.js route and client guides
        run: |
          find node_modules/next/dist/docs -type f -iname '*route*' -o -iname '*client-component*'
          for guide in node_modules/next/dist/docs/01-app/03-api-reference/03-file-conventions/route* node_modules/next/dist/docs/01-app/03-api-reference/01-directives/use-client*; do
            if test -f "$guide"; then cat "$guide"; fi
          done
      - run: npm run lint
        if: ${{ !cancelled() }}
      - run: npm run typecheck
        if: ${{ !cancelled() }}
      - run: npm run test:b1
        if: ${{ !cancelled() }}
      - run: node --experimental-strip-types --test --test-isolation=none tests/b2/*.test.ts
        if: ${{ !cancelled() }}
      - run: npm test
        if: ${{ !cancelled() }}
      - run: npm run build
        if: ${{ !cancelled() }}
      - run: npx playwright install --with-deps chromium
        if: ${{ !cancelled() }}
      - name: B1 production Next proxy regression including B2 reads
        if: ${{ !cancelled() }}
        run: node --experimental-strip-types scripts/test-b1-proxy-origin.mjs
      - name: Chromium real closed boundary and dashboard regression
        if: ${{ !cancelled() }}
        run: npx playwright test --config=playwright.b2-boundary.config.ts
      - run: npm audit --audit-level=high
        if: ${{ !cancelled() }}
      - name: Install pinned Semgrep
        if: ${{ !cancelled() }}
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0
      - name: Semgrep on B2 and shared HTTP contracts
        if: ${{ !cancelled() }}
        run: semgrep scan --config .semgrep/cleanops-foundation.yml --error --disable-nosem --metrics=off lib/b2 lib/b1/contracts.ts lib/b1/v4-broker.ts components/users-directory.tsx app/auth/users
      - name: Full shared B1 boundary scan with existing exact finding reviews
        if: ${{ !cancelled() }}
        run: python scripts/check-semgrep-reviewed.py
      - name: Gitleaks
        if: ${{ !cancelled() }}
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: '8.24.3'
      - name: Full reachable history Gitleaks scan with unchanged B1 fingerprints
        if: ${{ !cancelled() }}
        run: |
          test "$(git rev-parse --is-shallow-repository)" = false
          scan_status=0
          gitleaks detect --redact --exit-code=2 --report-format=json --report-path=/tmp/b2-gitleaks-full-raw.json --log-opts=HEAD || scan_status=$?
          B2_GITLEAKS_SCAN_EXIT="$scan_status" python scripts/b2-gitleaks-history.py
      - name: Preserve sanitized complete-history evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: b2-gitleaks-full-history-redacted
          path: artifacts/b2-security/gitleaks-full-history.json
          if-no-files-found: error
          retention-days: 14
