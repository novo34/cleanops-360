name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (v4.2.2)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Setup Node.js (v4.4.0)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high
      - name: Install Semgrep (v1.177.0)
        run: python -m pip install --disable-pip-version-check semgrep==1.177.0
      - name: Static security analysis (Semgrep v1.177.0, local ruleset 1.1.0)
        run: semgrep scan --config .semgrep/cleanops-foundation.yml --error --metrics=off . --exclude .semgrep/cleanops-foundation --exclude .semgrep/fixtures
      - name: Verify Semgrep rules with semgrep --test
        run: semgrep --test --config .semgrep/cleanops-foundation.yml --metrics=off .semgrep/cleanops-foundation
      - name: Secret scanning (Gitleaks v2)
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate CycloneDX SBOM (@cyclonedx/cyclonedx-npm v6.0.1)
        run: npm run sbom
      - name: Validate CycloneDX SBOM
        run: |
          node -e '
            const fs = require("fs");
            const sbom = JSON.parse(fs.readFileSync("sbom.cdx.json", "utf8"));
            if (sbom.bomFormat !== "CycloneDX" || !/^1\\./.test(sbom.specVersion)) throw new Error("Invalid CycloneDX metadata");
            if (!sbom.metadata?.component?.name || !Array.isArray(sbom.components) || sbom.components.length === 0) throw new Error("Incomplete SBOM metadata or components");
            if (!sbom.components.some(({ name }) => name === "next")) throw new Error("SBOM does not contain the runtime dependency next");
            if (sbom.metadata.timestamp || sbom.serialNumber) throw new Error("SBOM is not reproducible");
          '

      - name: Upload SBOM artifact (v6.0.0)
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cleanops-360-sbom-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
