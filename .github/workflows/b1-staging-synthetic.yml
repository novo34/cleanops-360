name: B1 synthetic staging preparation
on:
  push:
    tags: [review/first-actor-native-01-attempt-4]
  pull_request:
    paths:
      - 'deploy/staging/**'
      - 'scripts/*staging*'
      - 'tests/static/test_staging_synthetic.py'
      - '.github/workflows/b1-staging-synthetic.yml'
permissions:
  contents: read
jobs:
  preparation:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: python3 -m unittest discover -s tests/static -p test_staging_synthetic.py -v
      - run: node --test --test-isolation=none scripts/test-staging-archive.mjs
      # This auth transport correction has no SQL/PG/OpenBao execution authority.
      - if: github.head_ref != 'feat/b1-auth-proxy-origin'
        run: python3 scripts/staging-sql14.py
      - name: Install locked Node client for the existing native migration harness
        if: github.head_ref != 'feat/b1-auth-proxy-origin'
        run: npm ci --ignore-scripts --audit=false --fund=false
      # This auth transport correction has no SQL/PG/OpenBao execution authority.
      - if: github.head_ref != 'feat/b1-auth-proxy-origin'
        run: python3 scripts/test-staging-postgres.py
      # This auth transport correction has no SQL/PG/OpenBao execution authority.
      - if: github.head_ref != 'feat/b1-auth-proxy-origin'
        run: python3 scripts/test-staging-openbao-image.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: staging-synthetic-image-redacted
          path: artifacts/staging-synthetic/
          retention-days: 7

  first-actor-native:
    if: >-
      github.repository == 'novo34/cleanops-360' &&
      github.event_name == 'push' &&
      github.ref == 'refs/tags/review/first-actor-native-01-attempt-4' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: first-actor-native-01-attempt-4
      cancel-in-progress: false
    env:
      PG_IMAGE: postgres@sha256:cf5d353f55240ecc2f811827a15c7d1f2d562f08019b49dca12b5a59f4ab5962
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ee1f0f7800868c821653ce88040066d51187be2d
          persist-credentials: false
      - name: Verify approved source and artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ee1f0f7800868c821653ce88040066d51187be2d
          test -z "$(git status --porcelain)"
          sha256sum --check <<'HASHES'
          47e01db67174689cd8cef51ce5e473b4d0f8d6bf64ebbcaf9363a5be67109966  scripts/test-staging-postgres.py
          e949cb68937be2c2d1db50f1877769eee5571bc596261ba8fa92698a094f6c9d  tests/static/test_staging_synthetic.py
          89cf831220d23e01c528640412f06143eda5d52e1230217e8dfad0f7f89d5102  db/migrations/0002_first_actor.review.sql
          965dc8a96e70eb9104920916f635239bf8289b937a6c10a63130c203a47e37aa  docs/proposals/b1-consolidated-sql/revisions/14/schema.review.sql
          HASHES
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --audit=false --fund=false
      - name: Check runner dependencies and empty applicable queue
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -c 'import yaml'
          node --experimental-strip-types --input-type=module -e "await import('pg'); await import('argon2'); await import('otpauth')"
          sudo -n true
          docker --host=unix:///var/run/docker.sock version --format '{{.Server.Version}}'
          node scripts/migrate-postgres.mjs --offline-plan --profile=b1 > "$RUNNER_TEMP/first-actor-plan.json"
          python3 -B -c 'import json,sys; p=json.load(open(sys.argv[1])); assert p["migrations"] == []; assert p["proposed"][0]["executable"] is False' "$RUNNER_TEMP/first-actor-plan.json"
      # Future authorization must explicitly include this immutable image download.
      # Local alias is required by the unchanged, hash-pinned harness; never pull it.
      - name: Prepare the approved immutable PG16 image
        shell: bash
        run: |
          set -euo pipefail
          docker --host=unix:///var/run/docker.sock pull --platform linux/amd64 "$PG_IMAGE"
          docker --host=unix:///var/run/docker.sock tag "$PG_IMAGE" postgres:16-bookworm
          test "$(docker --host=unix:///var/run/docker.sock image inspect "$PG_IMAGE" --format '{{.Id}}')" = "$(docker --host=unix:///var/run/docker.sock image inspect postgres:16-bookworm --format '{{.Id}}')"
      - name: FIRST-ACTOR-NATIVE-01 attempt 4 — once
        run: python3 -B scripts/test-staging-postgres.py --first-actor --authorization FIRST-ACTOR-NATIVE-01
      - name: Hash sanitized native report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report=artifacts/staging-synthetic/first-actor-native.json
          if [ -f "$report" ]; then sha256sum "$report" > "$report.sha256"; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: first-actor-native-01-attempt-4
          path: |
            artifacts/staging-synthetic/first-actor-native.json
            artifacts/staging-synthetic/first-actor-native.json.sha256
          if-no-files-found: warn
          retention-days: 7
