name: B1 real browser PostgreSQL isolated
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  browser-pg:
    if: github.event.pull_request.number == 7 && github.event.before == 'fda096b762b4bd1e35c951e9aae545bbf1f39e61' && github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' && github.head_ref == 'feat/b1-http-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: New real UI API PostgreSQL tests on exact authorized SQL 05
        run: python3 scripts/pg-b1-browser.py
      - name: Redacted evidence only
        if: always()
        run: test ! -f artifacts/b1-real-browser/report.json || cat artifacts/b1-real-browser/report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1-real-browser-redacted
          path: artifacts/b1-real-browser/report.json
          retention-days: 7
