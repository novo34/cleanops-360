name: B1 technical integration after proxy correction
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'lib/b1/**'
      - 'components/auth-panel.tsx'
      - 'components/manage-access-panel.tsx'
      - 'scripts/**'
      - 'e2e/**'
      - '.github/workflows/b1-technical-integration.yml'
permissions:
  contents: read
jobs:
  private-integration:
    if: github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' && github.head_ref == 'feat/b1-final-validation' && github.base_ref == 'feat/b1-http-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scope: [pg-browser, pg-regression, openbao]
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Check isolation before any database or custody test
        run: |
          python - <<'PY'
          import os
          assert not os.environ.get('DATABASE_URL'), 'PERSISTENT_DATABASE_FORBIDDEN'
          assert not os.environ.get('CLEANOPS_TEST_DATABASE_URL'), 'PERSISTENT_DATABASE_FORBIDDEN'
          PY
          env -u DOCKER_HOST -u DOCKER_CONTEXT -u DOCKER_TLS -u DOCKER_TLS_VERIFY -u DOCKER_CERT_PATH docker --host=unix:///var/run/docker.sock info > /dev/null
          python scripts/staging-sql14.py
      - run: npm ci --ignore-scripts
      - name: Build existing frontend for real browser tests
        if: matrix.scope != 'openbao'
        run: npm run build
      - name: Install existing Chromium browser tests
        if: matrix.scope != 'openbao'
        run: npx playwright install --with-deps chromium
      - name: Existing SQL14 UI/session-policy tests through internal HTTP
        if: matrix.scope == 'pg-browser'
        env:
          B1_SQL14_GROUP: browser
          B1_TEST_INTERNAL_TRANSPORT: http://0.0.0.0:3000
        run: python scripts/pg-consolidated-14.py
      - name: Existing SQL14 RBAC/tenant-switch regression through proxy HTTPS
        if: matrix.scope == 'pg-regression'
        env:
          B1_SQL14_GROUP: regression
          B1_TEST_INTERNAL_TRANSPORT: https://0.0.0.0:3000
        run: python scripts/pg-consolidated-14.py
      - name: Existing real OpenBao/PG/B1 and independent recovery through both transports
        if: matrix.scope == 'openbao'
        run: python scripts/test-b1-openbao-integration.py
      - name: Preserve source identity for redacted execution report
        if: always()
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('artifacts/pg-consolidated-14/report.json')
          if p.exists():
              r=json.loads(p.read_text())
              r['validationSource']=os.environ['VALIDATION_SOURCE']
              r['validationRun']=os.environ['GITHUB_RUN_ID']
              r['validationScope']=os.environ['VALIDATION_SCOPE']
              p.write_text(json.dumps(r,indent=2)+'\n')
          PY
        env:
          VALIDATION_SOURCE: ${{ github.event.pull_request.head.sha }}
          VALIDATION_SCOPE: ${{ matrix.scope }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1-technical-${{ matrix.scope }}-redacted
          path: artifacts/pg-consolidated-14/report.json
          if-no-files-found: error
          retention-days: 14
  production-security:
    if: github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' && github.head_ref == 'feat/b1-final-validation' && github.base_ref == 'feat/b1-http-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: python -m pip install --disable-pip-version-check semgrep==1.177.0
      - name: All B1 production library and connected authentication/access panels
        run: semgrep scan --config .semgrep/cleanops-foundation.yml --error --disable-nosem --metrics=off lib/b1 components/auth-panel.tsx components/manage-access-panel.tsx
  dashboard-regression:
    if: github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' && github.head_ref == 'feat/b1-final-validation' && github.base_ref == 'feat/b1-http-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
      CLEANOPS_DEMO_URL: http://127.0.0.1:3117
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: b1-source
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a217cfeda74431b77ffa30d117febb62695c70d0
          path: staging-snapshot
          persist-credentials: false
      - name: Prove the B1 production origin correction matches staging before dashboard regression
        run: |
          cmp b1-source/lib/b1/service.ts staging-snapshot/lib/b1/service.ts
          cmp b1-source/lib/b1/runtime.ts staging-snapshot/lib/b1/runtime.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: staging-snapshot/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: staging-snapshot
      - run: npm run build
        working-directory: staging-snapshot
      - run: npx playwright install --with-deps chromium
        working-directory: staging-snapshot
      - name: Existing synthetic map/theme/responsive/private-boundary browser suite
        working-directory: staging-snapshot
        run: |
          node node_modules/next/dist/bin/next start --hostname 127.0.0.1 --port 3117 > /tmp/b1-dashboard-next.log 2>&1 &
          B1_DEMO_PID=$!
          trap 'kill "$B1_DEMO_PID" 2>/dev/null || true' EXIT
          ready=no
          for i in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:3117/demo > /dev/null; then ready=yes; break; fi
            sleep 1
          done
          test "$ready" = yes
          npx playwright test --config=playwright.demo-v0.config.ts
