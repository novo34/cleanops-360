name: B2 exact owner-authorized SQL5 R2 PostgreSQL
on:
  workflow_call:
    inputs:
      reservation_probe:
        type: boolean
        default: false
      native_reservation:
        type: boolean
        default: false
    outputs:
      native_receipt:
        description: Unauthenticated receipt data; consumer must verify immutable writer provenance
        value: ${{ jobs.aud031-reservation-probe.outputs.native_receipt }}
    secrets:
      CLEANOPS_NATIVE_AUTH_PRIVATE_KEY:
        required: false
      CLEANOPS_AUD031_NATIVE_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      confirm_reservation_probe:
        description: Explicitly authorize the synthetic reservation probe only (NO SQL)
        type: boolean
        required: true
        default: false
  pull_request_review:
    types: [submitted]
permissions:
  contents: read
jobs:
  acceptance-r2:
    # A commit-bound owner comment starts only this explicitly authorized validation.
    # No pull_request/push trigger: publishing evidence never repeats historical suites.
    if: >-
      (github.event.pull_request.number == 12 &&
      github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' &&
      github.event.pull_request.head.ref == 'feat/b2-users-access' &&
      github.event.review.user.login == github.repository_owner &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.review.body == 'Execute owner-authorized SQL5-R2 0eb651f3cfce5733726ca1d122e09bd1d0162c26; native isolated validation only.') ||
      (github.event_name == 'pull_request_review' && github.event.action == 'submitted' &&
      github.repository == 'novo34/cleanops-360' && github.repository_id == '1412999204' &&
      github.repository_owner == 'novo34' && github.actor == 'novo34' &&
      github.actor_id == '17856013' && github.triggering_actor == 'novo34' &&
      github.run_attempt == 1 && github.ref == 'refs/pull/22/merge' &&
      github.event.pull_request.number == 22 && github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.id == 1412999204 &&
      github.event.pull_request.head.repo.id == 1412999204 &&
      github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' &&
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.ref == 'codex/r3-sql5-controlled-preflight' &&
      github.event.review.user.login == 'novo34' && github.event.review.user.id == 17856013 &&
      github.event.sender.id == 17856013 && github.event.review.state == 'commented' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      ((startsWith(github.event.review.body, format('Observe owner-authorized SQL5-R3 workflow context candidate {0} manifest ', github.event.review.commit_id)) &&
      endsWith(github.event.review.body, '; metadata only, no services or SQL.')) ||
      (startsWith(github.event.review.body, format('Execute owner-authorized SQL5-R3 candidate {0} manifest ', github.event.review.commit_id)) &&
      endsWith(github.event.review.body, format(' base {0}; native isolated validation only.', github.event.pull_request.base.sha))))) ||
      (false && github.event_name == 'pull_request_review' && github.event.action == 'submitted' &&
      github.event.pull_request.number == 23 &&
      github.repository == 'novo34/cleanops-360' && github.repository_id == '1412999204' &&
      github.repository_owner == 'novo34' && github.actor == 'novo34' && github.actor_id == '17856013' &&
      github.triggering_actor == 'novo34' && github.run_attempt == 1 &&
      github.ref == format('refs/pull/{0}/merge', github.event.pull_request.number) &&
      github.event.pull_request.state == 'open' && github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.base.repo.id == 1412999204 && github.event.pull_request.head.repo.id == 1412999204 &&
      github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' && github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.head.ref == 'codex/r4-aud-031' &&
      github.event.review.user.login == 'novo34' && github.event.review.user.id == 17856013 &&
      github.event.sender.id == 17856013 && github.event.review.state == 'commented' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      startsWith(github.event.review.body, format('Execute owner-authorized SQL5-AUD031 candidate {0} manifest ', github.event.review.commit_id)) &&
      endsWith(github.event.review.body, format(' base {0}; native isolated validation only.', github.event.pull_request.base.sha)))
    # R3 capability requires a new exact C/M/W/B review in the canonical preflight;
    # publishing this workflow, ordinary reviews and historical approvals grant none.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      REVIEW_HEAD_REF: ${{ github.event.pull_request.head.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.review.commit_id }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Observe owner-authorized R3 workflow context without services
        if: github.event.pull_request.number == 22 && startsWith(github.event.review.body, 'Observe owner-authorized SQL5-R3 workflow context candidate ')
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          # Context evidence only. No harness/fixture import or native entrypoint.
          workflow_path = '.github/workflows/b2-acceptance-r2-postgres.yml'
          manifest_path = 'docs/proposals/b2-invitations/sql5-r3-candidate-manifest.review.json'
          output_path = 'artifacts/b2-acceptance-r3/workflow-context.json'
          evidence = {'schemaVersion': 1, 'scope': 'SQL5_R3_WORKFLOW_CONTEXT_ONLY', 'result': 'FAIL',
                      'reason': 'DIAGNOSTIC_CONTEXT_REJECTED'}
          exit_code = 1

          def require(condition):
              if not condition:
                  raise ValueError('DIAGNOSTIC_CONTEXT_REJECTED')

          def safe_path(name):
              current = Path.cwd()
              for part in Path(name).parts:
                  current = current / part
                  require(not current.is_symlink())
              return current

          def unique_pairs(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          try:
              env = os.environ
              event = json.loads(Path(env['GITHUB_EVENT_PATH']).read_bytes(), object_pairs_hook=unique_pairs)
              repo, pr, review = event['repository'], event['pull_request'], event['review']
              identity = lambda value: value['login'] == 'novo34' and value['id'] == 17856013
              repository = lambda value: value['full_name'] == 'novo34/cleanops-360' and value['id'] == 1412999204
              require(env.get('GITHUB_ACTIONS') == 'true' and env.get('RUNNER_ENVIRONMENT') == 'github-hosted')
              require(env.get('GITHUB_EVENT_NAME') == 'pull_request_review' and event['action'] == 'submitted')
              require(env.get('GITHUB_REPOSITORY') == 'novo34/cleanops-360' and env.get('GITHUB_REPOSITORY_ID') == '1412999204')
              require(env.get('GITHUB_REPOSITORY_OWNER') == 'novo34' and repository(repo) and identity(repo['owner']))
              require(identity(event['sender']) and identity(review['user']) and review['state'] == 'commented')
              require(env.get('GITHUB_ACTOR') == 'novo34' and env.get('GITHUB_ACTOR_ID') == '17856013')
              require(env.get('GITHUB_TRIGGERING_ACTOR') == 'novo34' and env.get('GITHUB_RUN_ATTEMPT') == '1')
              require(pr['number'] == 22 and pr['state'] == 'open' and pr['base']['ref'] == 'main')
              require(repository(pr['base']['repo']) and repository(pr['head']['repo']) and pr['head']['repo']['fork'] is False)
              branch = 'codex/r3-sql5-controlled-preflight'
              require(pr['head']['ref'] == branch and (not env.get('GITHUB_HEAD_REF') or env['GITHUB_HEAD_REF'] == branch))
              candidate, event_sha, workflow_sha = review['commit_id'], env['GITHUB_SHA'], env['GITHUB_WORKFLOW_SHA']
              require(all(isinstance(value, str) and re.fullmatch('[0-9a-f]{40}', value) for value in (candidate, event_sha, workflow_sha)))
              require(pr['head']['sha'] == candidate and env.get('GITHUB_REF') == 'refs/pull/22/merge')
              require(type(review['id']) is int and review['id'] > 0 and re.fullmatch('[1-9][0-9]*', env['GITHUB_RUN_ID']))
              workflow_ref = env['GITHUB_WORKFLOW_REF']
              expected_ref = 'novo34/cleanops-360/' + workflow_path + '@refs/pull/22/merge'
              allowed_refs = {expected_ref, 'novo34/cleanops-360/' + workflow_path + '@refs/heads/main',
                              'novo34/cleanops-360/' + workflow_path + '@refs/heads/' + branch}
              require(workflow_ref in allowed_refs)
              raw_manifest = safe_path(manifest_path).read_bytes()
              manifest_sha = hashlib.sha256(raw_manifest).hexdigest()
              require(review['body'] == f'Observe owner-authorized SQL5-R3 workflow context candidate {candidate} manifest {manifest_sha}; metadata only, no services or SQL.')
              manifest = json.loads(raw_manifest, object_pairs_hook=unique_pairs)
              workflow_digest = hashlib.sha256(safe_path(workflow_path).read_bytes()).hexdigest()
              require(type(manifest['schemaVersion']) is int and manifest['schemaVersion'] == 1)
              require(manifest['scope'] == 'SQL5_R3_ACCEPTANCE_HOSTED_EPHEMERAL_PG16')
              require(isinstance(manifest['files'], dict) and len(manifest['files']) == 34 and manifest['files'][workflow_path] == workflow_digest)
              checkout = subprocess.run(['git', '--no-replace-objects', 'rev-parse', 'HEAD'], check=True, capture_output=True, text=True).stdout.strip()
              require(checkout == candidate)
              evidence = {'schemaVersion': 1, 'scope': 'SQL5_R3_WORKFLOW_CONTEXT_ONLY', 'result': 'OBSERVED',
                          'pullRequest': 22, 'reviewId': review['id'], 'runId': env['GITHUB_RUN_ID'], 'runAttempt': 1,
                          'event': {'name': 'pull_request_review', 'action': 'submitted', 'ref': env['GITHUB_REF'], 'sha': event_sha},
                          'reviewCommit': candidate, 'checkoutCommit': checkout, 'manifestSha256': manifest_sha,
                          'workflow': {'ref': workflow_ref, 'sha': workflow_sha, 'checkoutFileSha256': workflow_digest},
                          'nativeRefContract': 'MATCH' if workflow_ref == expected_ref and workflow_sha == event_sha else 'MISMATCH',
                          'nativeExecution': 'NOT_INVOKED'}
              exit_code = 0
          except (KeyError, ValueError, TypeError, AttributeError, OSError, subprocess.SubprocessError):
              pass  # Emit only a fixed rejection, never exception text or payload.

          print(json.dumps(evidence, sort_keys=True))
          try:
              destination = safe_path(output_path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_text(json.dumps(evidence, sort_keys=True, indent=2) + '\n')
          except (ValueError, OSError):
              exit_code = 1
          raise SystemExit(exit_code)
          PY
      - name: Verify exact approved dependencies and hosted scope without SQL
        if: github.event.pull_request.number == 12
        run: env GITHUB_HEAD_REF="$REVIEW_HEAD_REF" python scripts/prepare-b2-composition-approval.py
      - name: Verify exact SQL5-R2 approval before isolated PG16 execution
        if: github.event.pull_request.number == 12
        run: env GITHUB_HEAD_REF="$REVIEW_HEAD_REF" python scripts/b2-acceptance-r2-postgres.review.py
      - name: R3 canonical entrypoint (new native authorization required)
        if: github.event.pull_request.number == 22 && startsWith(github.event.review.body, 'Execute owner-authorized SQL5-R3 candidate ') && endsWith(github.event.review.body, '; native isolated validation only.')
        run: python scripts/b2-directory-postgres.py --package sql5-r3
      - name: Preserve sanitized evidence for the selected route
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ startsWith(github.event.review.body, 'Execute owner-authorized SQL5-AUD031 candidate ') && 'b2-acceptance-aud031-pg16-sanitized' || (github.event.pull_request.number == 12 && 'b2-acceptance-r2-pg16-sanitized' || (startsWith(github.event.review.body, 'Observe owner-authorized SQL5-R3 workflow context candidate ') && 'b2-r3-workflow-context' || 'b2-acceptance-r3-pg16-sanitized')) }}
          path: ${{ startsWith(github.event.review.body, 'Execute owner-authorized SQL5-AUD031 candidate ') && 'artifacts/b2-acceptance-aud031/report.json' || (github.event.pull_request.number == 12 && 'artifacts/b2-acceptance-r2/report.json' || (startsWith(github.event.review.body, 'Observe owner-authorized SQL5-R3 workflow context candidate ') && 'artifacts/b2-acceptance-r3/workflow-context.json' || 'artifacts/b2-acceptance-r3/report.json')) }}
          if-no-files-found: error
          retention-days: 7
  aud031-reservation-probe:
    # Call this FILE via uses: owner/repo/path@APPROVED_SHA, never a relative
    # path/branch/merge ref. Caller addition needs separate reviewed publication.
    # Native writer profile requires its protected environment and exact owner review.
    if: (inputs.reservation_probe == true && github.repository == 'novo34/cleanops-360' && github.repository_id == '1412999204' && github.actor_id == '17856013' && github.run_attempt == 1 && github.event_name == 'workflow_dispatch' && github.ref == 'refs/tags/cleanops-native-auth-probe-caller-fixed1' && github.workflow_ref == 'novo34/cleanops-360/.github/workflows/b2-acceptance-r2-postgres.yml@refs/tags/cleanops-native-auth-probe-caller-fixed1') && inputs.native_reservation != true || (inputs.native_reservation == true && inputs.reservation_probe != true && github.repository == 'novo34/cleanops-360' && github.repository_id == '1412999204' && github.actor_id == '17856013' && github.run_attempt == 1 && github.event_name == 'pull_request_review' && github.ref == 'refs/pull/23/merge')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Environment must exist with owner approval, no administrator bypass,
    # only the exact immutable caller tag (no branch), and no repository copy
    # of the private key. No configuration or caller is installed by this file.
    # The future pinned caller passes this ONE declared name explicitly (never
    # inherit). Environment value takes precedence; a general repository copy
    # is NOT an acceptable final configuration and must be removed before runs.
    environment: ${{ inputs.native_reservation && 'cleanops-native-auth-validation' || 'cleanops-native-auth-probe' }}
    outputs:
      native_receipt: ${{ steps.app.outputs.native_receipt }}
    permissions:
      contents: read
    steps:
      - name: Validate approved caller before loading code or using the key
        env:
          NATIVE_PROFILE: ${{ inputs.native_reservation }}
          APPROVED_CALLER_SHA: ${{ vars.CLEANOPS_NATIVE_AUTH_APPROVED_CALLER_SHA }}
          CALLER_REPOSITORY: ${{ github.repository }}
          CALLER_REPOSITORY_ID: ${{ github.repository_id }}
          CALLER_ACTOR_ID: ${{ github.actor_id }}
          CALLER_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          CALLER_EVENT: ${{ github.event_name }}
          CALLER_REF: ${{ github.ref }}
          CALLER_WORKFLOW_REF: ${{ github.workflow_ref }}
          CALLER_WORKFLOW_SHA: ${{ github.workflow_sha }}
          CALLER_SHA: ${{ github.sha }}
          CALLER_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python -I - <<'PY'
          import os,re
          def approved_caller(values):
              if values.get('NATIVE_PROFILE')=='true':
                  fixed={'CALLER_REPOSITORY':'novo34/cleanops-360','CALLER_REPOSITORY_ID':'1412999204',
                         'CALLER_ACTOR_ID':'17856013','CALLER_TRIGGERING_ACTOR':'novo34',
                         'CALLER_EVENT':'pull_request_review','CALLER_REF':'refs/pull/23/merge',
                         'CALLER_WORKFLOW_REF':'novo34/cleanops-360/.github/workflows/b2-acceptance-r2-postgres.yml@refs/pull/23/merge',
                         'CALLER_ATTEMPT':'1'}
                  sha=values.get('CALLER_SHA','')
                  return (all(values.get(k)==v for k,v in fixed.items()) and re.fullmatch('[0-9a-f]{40}',sha) is not None
                          and sha==values.get('CALLER_WORKFLOW_SHA'))
              expected=values.get('APPROVED_CALLER_SHA','')
              if not re.fullmatch('[0-9a-f]{40}',expected):return False
              fixed={'CALLER_REPOSITORY':'novo34/cleanops-360','CALLER_REPOSITORY_ID':'1412999204',
                     'CALLER_ACTOR_ID':'17856013','CALLER_TRIGGERING_ACTOR':'novo34',
                     'CALLER_EVENT':'workflow_dispatch','CALLER_REF':'refs/tags/cleanops-native-auth-probe-caller-fixed1',
                     'CALLER_WORKFLOW_REF':'novo34/cleanops-360/.github/workflows/b2-acceptance-r2-postgres.yml@refs/tags/cleanops-native-auth-probe-caller-fixed1',
                     'CALLER_ATTEMPT':'1','CALLER_SHA':expected,'CALLER_WORKFLOW_SHA':expected}
              return all(values.get(k)==v for k,v in fixed.items())
          if not approved_caller(os.environ):
              print('FAIL approved caller context required; no credentials used')
              raise SystemExit(1)
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.native_reservation != true
        with:
          repository: novo34/cleanops-360
          ref: 993cf7305a50cd0cdfb808125e1775b2b2b96627
          path: trusted
          sparse-checkout: scripts/b2-directory-postgres.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: inputs.native_reservation == true
        with:
          repository: novo34/cleanops-360
          ref: 830b9665fb65a4ec10c1368ff52ad2a743061fb8
          path: trusted
          persist-credentials: false
      - name: Acquire exact historical objects before any private key
        if: inputs.native_reservation == true
        working-directory: trusted
        run: &aud031_historical_objects >-
          git --no-replace-objects fetch --no-tags --no-recurse-submodules
          --no-write-fetch-head --no-auto-maintenance
          https://github.com/novo34/cleanops-360.git
          3ea4ec890fd05a59ae803f005e29cad713d1e5e8
          147dac36c921e1ff1ee6af7ca1b30bf9425c0062
          cd138d71fb8fd8e9298e17c0f69b83e259ef3eba
      - name: Synthetic App reservation probe only (NO SQL); or disabled native writer
        id: app
        env:
          NATIVE_PROFILE: ${{ inputs.native_reservation }}
          # Select the NAME before lookup: an empty native key never falls back to the probe key.
          NATIVE_AUTH_KEY: ${{ secrets[inputs.native_reservation && 'CLEANOPS_AUD031_NATIVE_PRIVATE_KEY' || 'CLEANOPS_NATIVE_AUTH_PRIVATE_KEY'] }}
        run: |
          python -I - <<'PY'
          import base64, concurrent.futures, hashlib, importlib.util, json, os
          import pathlib, signal, subprocess, tempfile, threading, time, urllib.request, urllib.error

          # Only locally selected catalog values and numeric HTTP status reach logs.
          diagnostic={'stage':'TRUSTED_SOURCE','http':None}
          def mark(stage):
              diagnostic.update(stage=stage,http=None)
          def report_failure(error):
              stages=('TRUSTED_SOURCE', 'JWT_SIGNING', 'INSTALLATION', 'READ_TOKEN', 'INSTALLATION_SCOPE', 'READ_TOKEN_REVOCATION', 'WRITE_TOKEN', 'RESERVATION_RACE', 'REUSE', 'UPDATE_PROTECTION', 'DELETE_PROTECTION', 'RESERVATION_PRESERVATION', 'LOST_RESPONSE', 'TOKEN_REVOCATION', 'NATIVE_AUTHORIZATION', 'NATIVE_RESERVATION', 'NATIVE_RECEIPT')
              codes=('EXCLUSIVITY_FAILED', 'REUSE_ACCEPTED', 'REJECTION_NOT_CONFIRMED', 'PROTECTION_DENIAL_NOT_CONFIRMED', 'RESERVATION_NOT_PRESERVED', 'PROBE_SETUP_FAILED', 'UNCERTAIN_CREATION_RECOVERED', 'ENDPOINT_FORBIDDEN', 'TRUSTED_BYTES_REQUIRED', 'KEY_REQUIRED', 'SIGNING_FAILED', 'INSTALLATION_REQUIRED', 'TOKEN_REQUIRED', 'REPOSITORY_SCOPE_REQUIRED', 'READ_TOKEN_REVOCATION_REQUIRED', 'TOKEN_REVOCATION_FAILED', 'NATIVE_CONTEXT_CHANGED')
              stage=diagnostic['stage']
              if type(stage) is not str or stage not in stages:stage='UNKNOWN'
              code='UNEXPECTED_ERROR'
              if type(error) is RuntimeError and len(error.args)==1 and type(error.args[0]) is str and error.args[0] in codes:
                  code=error.args[0]
              status=diagnostic['http']
              http=str(status) if type(status) is int and 100<=status<=599 else 'NONE'
              print(f'FAIL trusted App reservation; NO SQL; stage={stage}; code={code}; last_http={http}')

          def exercise(api, reserve, auth, reservation_target):
              mark('RESERVATION_RACE')
              barrier=threading.Barrier(2, timeout=15)
              def create(ref, sha):
                  return api('POST','/repos/novo34/cleanops-360/git/refs',{'ref':ref,'sha':sha})
              def attempt(run, identity=auth, synchronize=True):
                  if synchronize:barrier.wait()
                  # Per-attempt state: the shared last_http cannot explain a race.
                  outcome={'http':None,'denial':'NO_RESPONSE','confirmed':False}
                  def observed_create(ref,sha):
                      status,response=create(ref,sha)
                      outcome['http']=status
                      if isinstance(response,dict):outcome['denial']=response.get('denialClass','NONE')
                      return status,response
                  try:
                      receipt=reserve(dict(identity,runId=run),observed_create)
                      outcome['confirmed']=True
                      return receipt,False
                  except RuntimeError:
                      # A lost response or a generic 422 is inconclusive, not a
                      # competing denial. Only the API's exact duplicate class counts.
                      return None,outcome['http']==422 and outcome['denial']=='REFERENCE_ALREADY_EXISTS'
                  finally:
                      status=outcome['http']
                      http=str(status) if type(status) is int and 100<=status<=599 else 'NONE'
                      denial=outcome['denial']
                      if type(denial) is not str or denial not in ('NO_RESPONSE','NONE','REFERENCE_ALREADY_EXISTS','RULESET_DENIED','INTEGRATION_DENIED','WORKFLOW_DENIED','OTHER_HTTP_ERROR'):
                          denial='OTHER_HTTP_ERROR'
                      print(f'PROBE attempt={run}; confirmed={outcome["confirmed"]}; http={http}; denial={denial}')
              with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:
                  results=list(pool.map(attempt,('1','2')))
              winners=[receipt for receipt,rejected in results if receipt is not None]
              if len(winners)!=1 or sum(rejected for receipt,rejected in results)!=1:
                  raise RuntimeError('EXCLUSIVITY_FAILED')
              receipt=winners[0]
              mark('REUSE')
              reused,rejected=attempt('3',synchronize=False)
              if reused is not None:raise RuntimeError('REUSE_ACCEPTED')
              if not rejected:raise RuntimeError('REJECTION_NOT_CONFIRMED')
              endpoint='/repos/novo34/cleanops-360/git/'+receipt['ref']
              for method,payload in [('PATCH',{'sha':auth['base'],'force':True}),('DELETE',None)]:
                  mark('UPDATE_PROTECTION' if method=='PATCH' else 'DELETE_PROTECTION')
                  status,denial=api(method,endpoint,payload)
                  if status not in (403,422) or denial.get('rulesetDenied') is not True:
                      raise RuntimeError('PROTECTION_DENIAL_NOT_CONFIRMED')
              mark('RESERVATION_PRESERVATION')
              status,value=api('GET',endpoint.replace('/git/refs/','/git/ref/',1),None)
              if status!=200 or value.get('object',{}).get('sha')!=reservation_target:
                  raise RuntimeError('RESERVATION_NOT_PRESERVED')
              # Lost reply AFTER server creation must burn a separate probe identity.
              mark('LOST_RESPONSE')
              lost=dict(auth,reviewBodySha256=hashlib.sha256(b'probe-lost-response').hexdigest())
              created=False
              def uncertain(ref,sha):
                  nonlocal created
                  status,value=create(ref,sha)
                  if (status!=201 or not isinstance(value,dict) or value.get('ref')!=ref
                          or value.get('object',{}).get('type')!='commit' or value['object'].get('sha')!=sha):
                      raise RuntimeError('PROBE_SETUP_FAILED')
                  created=True
                  raise TimeoutError('simulated lost reply')
              try:reserve(lost,uncertain)
              except RuntimeError as error:
                  if not created or error.args!=('AUD031_EXCLUSIVE_RESERVATION_NOT_CONFIRMED',):
                      raise RuntimeError('PROBE_SETUP_FAILED') from None
              else:raise RuntimeError('UNCERTAIN_CREATION_RECOVERED')
              reused,rejected=attempt('4',identity=lost,synchronize=False)
              if reused is not None:raise RuntimeError('UNCERTAIN_CREATION_RECOVERED')
              if not rejected:raise RuntimeError('REJECTION_NOT_CONFIRMED')
              return receipt['ref']

