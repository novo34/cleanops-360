name: B1 proxy origin regression
on:
  pull_request:
    branches: [staging]
    paths:
      - 'lib/b1/**'
      - 'tests/b1/**'
      - 'deploy/staging/**'
      - 'scripts/*b1*origin*'
      - '.github/workflows/b1-proxy-origin.yml'
  push:
    branches: [staging]
    paths:
      - 'lib/b1/**'
      - 'tests/b1/**'
      - 'deploy/staging/**'
      - 'scripts/*b1*origin*'
      - '.github/workflows/b1-proxy-origin.yml'
permissions:
  contents: read
jobs:
  origin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Read installed Next request documentation
        run: |
          find node_modules/next/dist/docs -iname '*request*' -o -iname '*route-handler*' | head -20
          sed -n '1,200p' node_modules/next/dist/docs/01-app/03-api-reference/04-functions/next-request.md
      - name: Observe real production Next URL and proxy headers
        run: node scripts/probe-b1-origin.mjs
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:b1
      - run: npm test
      - run: npm run build
      - name: Verify real B1 routes through production Next server
        run: node --experimental-strip-types scripts/test-b1-proxy-origin.mjs
