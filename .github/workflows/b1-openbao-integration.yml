name: B1 OpenBao real private integration and independent recovery
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  isolated-integration:
    if: github.event.pull_request.number == 7 && github.event.before == 'cc9d2a0aea17747c117b445ac53539fda906cda2' && github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' && github.head_ref == 'feat/b1-http-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:b1
      - run: python3 -m unittest discover -s tests/static -p 'test_b1_openbao*.py' -v
      - run: python3 scripts/test-b1-openbao-integration.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: openbao-b1-integrated-redacted
          path: artifacts/pg-consolidated-14/report.json
          retention-days: 7
