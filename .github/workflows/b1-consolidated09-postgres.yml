name: B1 SQL09 authorized recovery PostgreSQL
on:
  pull_request:
    types: [synchronize]
permissions:
  contents: read
jobs:
  recovery-pg:
    if: github.event.pull_request.number == 7 && github.event.before == 'e2d8dfcc05711d39d647a703085999ba704ada81' && github.event.pull_request.head.repo.full_name == 'novo34/cleanops-360' && github.head_ref == 'feat/b1-http-flows'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      DATABASE_URL: ''
      CLEANOPS_TEST_DATABASE_URL: ''
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:b1
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: python3 scripts/pg-consolidated-09.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: b1-sql09-recovery-pg-redacted
          path: artifacts/pg-consolidated-09/report.json
          retention-days: 7
