# OPENBAO-STAGING-01: same Compose Path; profile remains opt-in.
include:
  - compose.openbao.yaml
  - ../openbao/compose.agent.yaml

name: ${CLEANOPS_COMPOSE_PROJECT:?Explicit Compose project required}
services:
  web:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      CLEANOPS_AUTH_ORIGIN: ${CLEANOPS_AUTH_ORIGIN:?Set trusted HTTPS origin}
      # Exact Next listener URLs, not public origins and never inferred from headers.
      CLEANOPS_AUTH_INTERNAL_ORIGINS: '${CLEANOPS_AUTH_INTERNAL_ORIGINS:-["http://0.0.0.0:3000","https://0.0.0.0:3000","http://127.0.0.1:3000"]}'
      # B1 runtime intentionally remains closedBackend until approved integration.
    volumes:
      - type: volume
        source: identity_agent_sink
        target: /run/cleanops-agent
        read_only: true
        volume: {nocopy: true}
    expose:
      - "3000"
    networks:
      - private
      - identity_bao
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 768m
    cpus: "0.65"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/login',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 50s

  postgres:
    image: ${CLEANOPS_PG_IMAGE:?Verified existing PostgreSQL image required}
    # With cap_drop ALL, start as postgres: root entrypoint cannot use gosu/setuid.
    user: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CLEANOPS_PG_DATABASE:?Existing PostgreSQL database required}
      POSTGRES_USER: ${CLEANOPS_PG_BOOTSTRAP_USER:?Existing PostgreSQL bootstrap role required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets:
      - postgres_bootstrap_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - type: bind
        source: ${CLEANOPS_PG_TLS_CERT_FILE:?Absolute private file path outside checkout required}
        target: /run/cleanops-pg-tls/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLEANOPS_PG_TLS_KEY_FILE:?Absolute private file path outside checkout required}
        target: /run/cleanops-pg-tls/server.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLEANOPS_PG_TLS_CA_FILE:?Absolute private file path outside checkout required}
        target: /run/cleanops-pg-tls/ca.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLEANOPS_PG_HBA_FILE:?Absolute private file path outside checkout required}
        target: ${CLEANOPS_PG_HBA_TARGET:?Observed absolute PostgreSQL hba_file path required}
        read_only: true
        bind:
          create_host_path: false
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/run/cleanops-pg-tls/server.crt
      - -c
      - ssl_key_file=/run/cleanops-pg-tls/server.key
      - -c
      - hba_file=${CLEANOPS_PG_HBA_TARGET:?Observed absolute PostgreSQL hba_file path required}
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    cpus: "0.6"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "psql -XqAt -w -v ON_ERROR_STOP=1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -c 'SELECT 1'"]
      interval: 20s
      timeout: 5s
      retries: 5

networks:
  private:
    internal: true
    name: ${CLEANOPS_PRIVATE_NETWORK:?Existing private network required}

volumes:
  pgdata:
    name: ${CLEANOPS_PG_VOLUME:?Existing PostgreSQL volume name required}

secrets:
  postgres_bootstrap_password:
    file: ${CLEANOPS_PG_PASSWORD_FILE:?Absolute path to private file outside repo}


