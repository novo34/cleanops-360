# B1 ingress DELTA — PREPARED, NOT ACTIVE. Nothing here is read by Dokploy, Traefik or CI.
# Applying it is a separately authorized staging operation (see the B1 closure execution runbook).
#
# Part 1 (Traefik file-provider, dynamic config) and part 2 (Compose overlay on the web service)
# are applied together. The existing routers (cleanops360-f4fxmd-15-web / -websecure on port 3000),
# /login, static assets and redirect-to-https@file are NOT edited; only a NEW higher-priority
# router for the narrow B1 paths is added, so removing the file restores today's behaviour.
#
# D3 — why no IP is configured: web and Traefik share the Overlay network dokploy-network, where
# a container address changes at every re-creation. Traefik therefore reaches the listener by a
# STABLE DNS ALIAS on that network (part 2) and the web process picks its own overlay address at
# startup from the reviewed manifest `ingress.binding` given as a private CIDR (the dokploy-network
# subnet, e.g. "10.0.X.0/24"; resolveIngressBinding, fail-closed on 0 or >1 match). The listener is
# never published (no `ports:`), never bound to a wildcard, and mTLS + the pinned proxy certificate
# are enforced exactly as before: another container on the overlay can open a TCP connection but
# cannot pass the client-certificate check (denied before any database access).
#
# Placeholders in <...> must come from the read-only evidence bundle (step A). The TLS server
# certificate of the listener MUST carry DNS:cleanops-b1-ingress in its SAN (Traefik verifies the
# address host name; insecureSkipVerify stays false).

# ---- Part 1: Traefik dynamic configuration (file provider) -------------------------------------
http:
  middlewares:
    cleanops-b1-forward-auth:
      forwardAuth:
        address: "https://cleanops-b1-ingress:<ingress.port>/forward-auth"
        # Original client-supplied forwarding headers are discarded by Traefik and rebuilt once.
        trustForwardHeader: false
        tls:
          ca: <path of the CA that signed the listener certificate, read-only in Traefik>
          cert: <path of the pinned Traefik client certificate (SHA-256 = manifest proxyCertificateSha256)>
          key: <path of its private key, never in Git>
          insecureSkipVerify: false
        # Forwarded to the listener: only what the assertion binds (cookie carries the device credential).
        authRequestHeaders: [Cookie, X-Forwarded-Method, X-Forwarded-Proto, X-Forwarded-Host, X-Forwarded-Uri, X-Forwarded-For]
        # The only header copied from the ForwardAuth answer onto the upstream request.
        authResponseHeaders: [X-Cleanops-B1-Assertion]
    cleanops-b1-strip-assertion:
      headers:
        customRequestHeaders:
          X-Cleanops-B1-Assertion: ""     # an empty value removes any client-supplied assertion first
  routers:
    cleanops360-b1-guarded:
      # Existing authenticated-resource routes (verified in app/ on this branch).
      # Do NOT guard /auth/login or /mfa/* here: they are authentication bootstrap routes.
      # Additional B1 operations require an explicit per-operation mapping before activation.
      rule: Host(`cleanops.nuvurent.com`) && (Path(`/auth/me`) || PathPrefix(`/auth/access`) || PathPrefix(`/me/sessions`) || PathPrefix(`/me/trusted-devices`))
      entryPoints: [websecure]
      priority: 1000                    # above the existing websecure router; same service, same port 3000
      tls:
        certResolver: letsencrypt
      middlewares: [cleanops-b1-strip-assertion, cleanops-b1-forward-auth]
      service: <existing service name of cleanops360-f4fxmd-15-websecure>@docker   # reuse, do not define a new one

# ---- Part 2: Compose overlay on the web service (separate file at apply time) ------------------
# services:
#   web:
#     stop_grace_period: 40s            # D4: > ingress.drainTimeoutMs (max 30 s) + Next.js own close
#     stop_signal: SIGTERM
#     networks:
#       <key of dokploy-network in the EFFECTIVE Compose>:
#         aliases: [cleanops-b1-ingress]
#
# Optional extra isolation (NOT required for the control above; do not apply without a decision):
# a dedicated attachable overlay `cleanops-b1-forwardauth` with only {web, dokploy-traefik}, the
# alias moved onto it, and `docker network connect cleanops-b1-forwardauth dokploy-traefik`.
# That touches the Dokploy-managed Traefik container, so it is a separate owner decision; the
# rollback is `docker network disconnect` + removing the alias.
#
# Rollback of parts 1+2: delete this dynamic-config file (Traefik reloads it; original routers are
# untouched), then redeploy the previous web Compose revision (no alias, default stop grace).
