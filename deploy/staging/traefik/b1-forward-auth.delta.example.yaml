# B1 ingress DELTA — PREPARED, NOT ACTIVE. Nothing here is read by Dokploy, Traefik or CI.
# Applying it is a separately authorized staging operation (see the B1 closure execution runbook).
#
# Part 1 (Traefik file-provider, dynamic config) and part 2 (Compose overlay on the web service)
# are applied together. The existing routers (cleanops360-f4fxmd-15-web / -websecure on port 3000),
# /login, static assets and redirect-to-https@file are NOT edited; only a NEW higher-priority
# router for the narrow B1 paths is added, so removing the file restores today's behaviour.
#
# D3 — why no IP is configured: web and Traefik share the Overlay network dokploy-network, where
# a container address changes at every re-creation. Traefik therefore reaches the listener by a
# STABLE DNS ALIAS on that network (part 2) and the web process picks its own overlay address at
# startup from the reviewed manifest `ingress.binding` given as a private CIDR (the dokploy-network
# subnet, e.g. "10.0.X.0/24"; resolveIngressBinding, fail-closed on 0 or >1 match). The listener is
# never published (no `ports:`), never bound to a wildcard, and mTLS + the pinned proxy certificate
# are enforced exactly as before: another container on the overlay can open a TCP connection but
# cannot pass the client-certificate check (denied before any database access).
#
# 03/11/2026 operational reconciliation (PREPARATION ONLY):
# - The deployed Dokploy Compose is exactly staging SHA d3ea84b38fd1574db1610f03b59c8c4a5050ac72;
#   sha256 of the effective compose.yaml = 03e2033c7c456b6eded20d68e8babe7af20596b14617f0a86d34997aa407578c.
# - Existing image sha256:ad632f802c2d0992166f2db7ba7242c2c5b401144244b42fe72a1a8d7b20b290
#   is still serving /login. Never merge into auto-deployed staging to test this example.
# - The B1 candidate image cleanops360-b1-candidate:cc51574a has built and passed private loader
#   checks separately; the first administrator is already COMMITTED in PostgreSQL. Do not re-enroll.
# - The reviewed install-config validator currently REQUIRES uppercase colon-delimited
#   SHA-256 (32 octets, 95 characters). The manifest has that shape already. Do NOT normalize
#   it to lower-case unseparated hex; identify and compare the actual Traefik mTLS client
#   certificate fingerprint before activation.
# - ingress.evidenceReference is unfilled; an actual independently reviewed and attributable
#   network/TLS configuration evidence reference is required. Do NOT invent it.
# - No ForwardAuth, serversTransport, clientCertificates or rootCAs token was found in
#   five inspected dynamic configuration files. This is not proof of global absence.
# - The existing Agent sink is volume cleanops360-f4fxmd_identity_agent_sink. A separate
#   UID/GID 999:999 read-only container confirmed access. No replacement Agent or new token.
# - Traefik and web share dokploy-network, but verify the manifest ingress.binding CIDR
#   resolves uniquely to the web interface on THAT network; do not use the Bao custody network
#   as a guessed ingress transport.
# - No actual Traefik CLIENT certificate/key/CA locations have been approved or inspected.
#   TLS placeholders below are deliberate deployment STOPs, not values to fill from LE certs.
# - Do not copy this example into /etc/dokploy/traefik/dynamic until configuration parser,
#   certificate SAN, header sanitization, routing, prelogin device enrollment and rollback
#   have passed independent review and owner authorization.
#
# Placeholders in <...> must come from the read-only evidence bundle (step A). The TLS server
# certificate of the listener MUST carry DNS:cleanops-b1-ingress in its SAN (Traefik verifies the
# address host name; insecureSkipVerify stays false).

# ---- Part 1: Traefik dynamic configuration (file provider) -------------------------------------
http:
  middlewares:
    cleanops-b1-forward-auth:
      forwardAuth:
        address: "https://cleanops-b1-ingress:<ingress.port>/forward-auth"
        # Original client-supplied forwarding headers are discarded by Traefik and rebuilt once.
        trustForwardHeader: false
        # B1 binds the exact original request method into its signed assertion.
        # Traefik ForwardAuth otherwise forwards GET by default even for POSTs.
        preserveRequestMethod: true
        tls:
          ca: <path of the CA that signed the listener certificate, read-only in Traefik>
          cert: <path of the pinned Traefik client certificate (SHA-256 = manifest proxyCertificateSha256)>
          key: <path of its private key, never in Git>
          insecureSkipVerify: false
        # The issuer binds the exact request body and selected headers. Traefik
        # defaults forwardBody=false, which would invalidate every nonempty POST.
        # The private listener also enforces the reviewed maximumBodyBytes.
        forwardBody: true
        maxBodySize: 65536
        # Keep precisely the request headers covered by requestBinding(), plus
        # Traefik-rebuilt forwarding metadata. Do not accept untrusted assertions.
        authRequestHeaders: [Host, Authorization, Cookie, Origin, Content-Type, Content-Encoding, X-CSRF-Token, Idempotency-Key, Sec-Fetch-Site, X-Forwarded-Method, X-Forwarded-Proto, X-Forwarded-Host, X-Forwarded-Uri, X-Forwarded-For]
        # The only header copied from the ForwardAuth answer onto the upstream request.
        authResponseHeaders: [X-Cleanops-B1-Assertion]
    cleanops-b1-strip-assertion:
      headers:
        customRequestHeaders:
          X-Cleanops-B1-Assertion: ""     # an empty value removes any client-supplied assertion first
  routers:
    cleanops360-b1-guarded:
      # All real B1 HTTP operations use handleAuth -> requestScope -> assertion verifier,
      # including /auth/login and /mfa/* (not just post-login resources).
      # Do not activate until the independent operator enrolled a valid device
      # credential and the full private ingress/SQL package is accepted.
      rule: Host(`cleanops.nuvurent.com`) && (PathPrefix(`/auth/`) || PathPrefix(`/mfa/`) || PathPrefix(`/me/`))
      entryPoints: [websecure]
      priority: 1000                    # above the existing websecure router; same service, same port 3000
      tls:
        certResolver: letsencrypt
      middlewares: [cleanops-b1-strip-assertion, cleanops-b1-forward-auth]
      service: <existing service name of cleanops360-f4fxmd-15-websecure>@docker   # reuse, do not define a new one

