# REVIEW ONLY — B1 device-only UI + isolated Next.js assets.
# This is NOT installed by Traefik or Dokploy.
# Requires an independently staged canary built with assetPrefix=/b1-static and
# started with CLEANOPS_B1_ASSET_PREFIX=/b1-static at RUNTIME as well.
# Existing pinned image: cleanops360-b1-assets-candidate:296d4ef2.
# Container is separate, named cleanops360-b1-assets-shadow-296d4ef2.
# Never replace either already running old shadow/web with this YAML alone.
#
# The original app continues to own ALL /_next/static/* requests.
# AssetPrefix changes B1-generated references to /b1-static/_next/static/*.
# Traefik strips /b1-static before forwarding, since Next serves /_next/static.
# The candidate's rendered HTML must reference /b1-static/_next/static/... .
# Static assets carry NO session secrets; explicit public isolation is reviewed separately.
#
# Device cookie is still NOT an authentication decision. The ForwardAuth middleware
# validates its token and issues the request-bound assertion for /login.
# Reject any attempt to remove the ForwardAuth / mTLS barrier from /login.
http:
  middlewares:
    cleanops-b1-asset-strip-prefix:
      stripPrefix:
        prefixes: [/b1-static]
  routers:
    cleanops360-b1-device-login:
      rule: 'Host("cleanops.nuvurent.com") && Path("/login") && HeaderRegexp("Cookie", "(^|;[ ]*)__Host-cleanops_b1_ingress_device=")'
      priority: 1200
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [cleanops-b1-strip-assertion@file, cleanops-b1-forward-auth@file]
      service: cleanops-b1-assets-shadow@file
    cleanops360-b1-device-assets:
      rule: 'Host("cleanops.nuvurent.com") && PathPrefix("/b1-static/_next/static/")'
      priority: 1200
      entryPoints: [websecure]
      tls:
        certResolver: letsencrypt
      middlewares: [cleanops-b1-asset-strip-prefix]
      service: cleanops-b1-shadow@file
  services:
    cleanops-b1-assets-shadow:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://cleanops-b1-assets:3000"
