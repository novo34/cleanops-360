# Opt-in web binding. Merge with the PRESERVED operative Compose, never replace it.
# Does not define/recreate PG or Bao. Include canonical Agent resources exactly once.
services:
  web:
    image: ${CLEANOPS_STAGING_WEB_IMAGE:?Verified prebuilt web image with digest required}
    pull_policy: never
    volumes:
      - type: volume
        source: identity_agent_sink
        target: /run/cleanops-agent
        read_only: true
        volume: {nocopy: true}
      - type: bind
        source: ${CLEANOPS_B1_PRIVATE_DIR:?Approved root-owned private web package required}
        target: /run/cleanops-b1-private
        read_only: true
        bind: {create_host_path: false}
    networks:
      - identity_bao
    ulimits:
      core: {soft: 0, hard: 0}
