# Opt-in web binding. Merge with the PRESERVED operative Compose, never replace it.
# Reuses the existing Agent network/sink without defining or starting an Agent.
# The running docker-run Agent remains its sole writer.
services:
  web:
    image: ${CLEANOPS_STAGING_WEB_IMAGE:?Verified prebuilt web image with digest required}
    pull_policy: never
    volumes:
      - type: volume
        source: identity_agent_sink
        target: /run/cleanops-agent
        read_only: true
        volume: {nocopy: true}
      - type: bind
        source: ${CLEANOPS_B1_PRIVATE_DIR:?Approved root-owned private web package required}
        target: /run/cleanops-b1-private
        read_only: true
        bind: {create_host_path: false}
    networks:
      - identity_bao
    ulimits:
      core: {soft: 0, hard: 0}

networks:
  identity_bao:
    external: true
    name: ${CLEANOPS_AGENT_NETWORK:?Existing private Bao network required}
volumes:
  identity_agent_sink:
    external: true
    name: ${CLEANOPS_COMPOSE_PROJECT:?Explicit installation project required}_identity_agent_sink
