name: cleanops-demo-preview
services:
  app:
    build:
      context: ../..
      dockerfile: deploy/demo-preview/Dockerfile
      target: app
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
    networks: [demo_private]
    read_only: true
    tmpfs: ['/tmp:size=64m,noexec,nosuid']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/demo').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
  gateway:
    build:
      context: ../..
      dockerfile: deploy/demo-preview/Dockerfile
      target: gateway
    environment:
      PREVIEW_HOST: 0.0.0.0
      PREVIEW_USER: owner
      PREVIEW_PASSWORD_FILE: /run/secrets/preview_password
      PREVIEW_UPSTREAM: http://app:3000
    secrets: [preview_password]
    ports: ['127.0.0.1:3187:8080']
    networks: [demo_private, demo_ingress]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 96m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
secrets:
  preview_password:
    file: ${PREVIEW_PASSWORD_PATH:?Set an absolute path outside the repository}
networks:
  demo_private:
    internal: true
  demo_ingress: {}
