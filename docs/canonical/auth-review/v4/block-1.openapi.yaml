      responses:
        '200':
          description: Confirmed result; see HTTP_CONTRACT.md for state/cookie transitions
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Set-Cookie:
              schema:
                type: string
                minLength: 1
                maxLength: 2048
              description: Only transitions/revocation; Secure HttpOnly Path=/ SameSite=Lax;
                never Domain
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/confirmTotpResponse'
        '400':
          description: Malformed JSON, illegal selector or unknown query
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing/invalid/expired session or bound ceremony, generic
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Policy/CSRF/step-up denied
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Absent/invisible session; indistinguishable cross-tenant
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: State/replay/idempotency conflict or one-time result not replayable
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: Request exceeds 16384 bytes
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: Not application/json for JSON input
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Safe input/domain validation error
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited; Retry-After seconds, no account enumeration
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
            Retry-After:
              schema:
                type: integer
                minimum: 1
                maximum: 900
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Dependency unavailable; no downgrade
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - SessionCookie: []
      - PreauthCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpConfirmInput'
components:
  schemas:
    ErrorDetail:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
          minLength: 1
          maxLength: 80
        code:
          type: string
          minLength: 1
          maxLength: 64
      required:
      - code
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              minLength: 1
              maxLength: 64
            message:
              type: string
              minLength: 1
              maxLength: 300
            details:
              type: array
              maxItems: 16
              items:
                $ref: '#/components/schemas/ErrorDetail'
          required:
          - code
          - message
          - details
        correlation_id: *id002
      required:
      - error
      - correlation_id
    Meta:
      type: object
      additionalProperties: false
      properties:
        correlation_id: *id002
      required:
      - correlation_id
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
        organization_hint:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
    ChallengeReference:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id002
      required:
      - challenge_id
    MfaVerifyInput:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id002
        method:
          type: string
          minLength: 4
          maxLength: 9
          enum:
          - EMAIL_OTP
          - TOTP
        proof:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
          writeOnly: true
      required:
      - challenge_id
      - method
      - proof
    Reason:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - reason
    SwitchTenantInput:
      type: object
      additionalProperties: false
      properties:
        target_tenant_id: *id002
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - target_tenant_id
      - reason
    TotpConfirmInput:
      type: object
      additionalProperties: false
      properties:
        enrollment_id: *id002
        proof:
          type: string
          minLength: 6
          maxLength: 6
          pattern: ^[0-9]{6}$
          writeOnly: true
      required:
      - enrollment_id
      - proof
    StepUpInput:
      type: object
      additionalProperties: false
      properties:
        grant_id:
          type: string
          minLength: 10
          maxLength: 10
          enum:
          - B1-SELF-04
          - B1-SELF-05
          - B1-SELF-06
          - B1-SELF-08
        resource_id: *id002
      required:
      - grant_id
      allOf:
      - if:
          properties:
            grant_id:
              const: B1-SELF-08
        then:
          required:
          - resource_id
        else:
          not:
            required:
            - resource_id
    Active:
      type: object
      additionalProperties: false
      properties:
        state:
          const: ACTIVE
        session_id: *id002
        tenant_id: *id002
        absolute_expires_at: &id003
          type: string
          minLength: 20
          maxLength: 35
          format: date-time
      required:
      - state
      - session_id
      - tenant_id
      - absolute_expires_at
    PendingMfa:
      type: object
      additionalProperties: false
      properties:
        state:
          const: PENDING_MFA
        challenge_id: *id002
        allowed_methods:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 4
            maxLength: 9
            enum:
            - EMAIL_OTP
            - TOTP
        expires_at: *id003
      required:
      - state
      - challenge_id
      - allowed_methods
      - expires_at
    EnrollmentRequired:
      type: object
      additionalProperties: false
      properties:
        state:
          const: ENROLLMENT_REQUIRED
        allowed_methods:
          type: array
          minItems: 1
          maxItems: 1
          items:
            const: TOTP
        expires_at: *id003
      required:
      - state
      - allowed_methods
      - expires_at
    TenantSelection:
      type: object
      additionalProperties: false
      properties:
        state:
          const: TENANT_SELECTION_REQUIRED
        expires_at: *id003
      required:
      - state
      - expires_at
    AuthResult:
      oneOf:
      - $ref: '#/components/schemas/Active'
      - $ref: '#/components/schemas/PendingMfa'
      - $ref: '#/components/schemas/EnrollmentRequired'
      - $ref: '#/components/schemas/TenantSelection'
    Challenge:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id002
        expires_at: *id003
        method:
          type: string
          minLength: 4
          maxLength: 9
          enum:
          - EMAIL_OTP
          - TOTP
      required:
      - challenge_id
      - expires_at
      - method
    Session:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        tenant_id: *id002
        user_id: *id002
        created_at: *id003
        last_activity_at: *id003
        absolute_expires_at: *id003
        device_label:
          type: string
          minLength: 1
          maxLength: 120
        browser_label:
          type: string
          minLength: 1
          maxLength: 120
        is_current:
          type: boolean
      required:
      - id
      - tenant_id
      - user_id
      - created_at
      - last_activity_at
      - absolute_expires_at
      - device_label
      - browser_label
      - is_current
    SessionList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Session'
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
      required:
      - items
      - next_cursor
    User:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        tenant_id: *id002
        display_name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
      required:
      - id
      - tenant_id
      - display_name
      - email
    Tenant:
      type: object
      additionalProperties: false
      properties:
        id: *id002
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - id
      - name
    TenantList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Tenant'
        next_cursor:
          oneOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
      required:
      - items
      - next_cursor
    Result:
      type: object
      additionalProperties: false
      properties:
        state:
          type: string
          minLength: 7
          maxLength: 7
          enum:
          - REVOKED
        revoked_count:
          type: integer
          minimum: 0
          maximum: 2147483647
      required:
      - state
      - revoked_count
    TotpEnrollment:
      type: object
      additionalProperties: false
      properties:
        enrollment_id: *id002
        provisioning_uri:
          type: string
          minLength: 1
          maxLength: 2048
        expires_at: *id003
      required:
      - enrollment_id
      - provisioning_uri
      - expires_at
    RecoveryCodes:
      type: object
      additionalProperties: false
      properties:
        codes:
          type: array
          minItems: 10
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 26
            maxLength: 26
            pattern: ^[A-Z2-7]{26}$
        display_once:
          const: true
        auth:
          $ref: '#/components/schemas/AuthResult'
      required:
      - codes
      - display_once
      - auth
    StepUpResult:
      type: object
      additionalProperties: false
      properties:
        challenge_id: *id002
        expires_at: *id003
        allowed_methods:
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            type: string
            minLength: 4
            maxLength: 9
            enum:
            - EMAIL_OTP
            - TOTP
      required:
      - challenge_id
      - expires_at
      - allowed_methods
    loginResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AuthResult'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    resendOtpResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Challenge'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    verifyMfaResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AuthResult'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    logoutResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Result'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    startStepUpResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/StepUpResult'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    getCurrentIdentityResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    listAuthorizedTenantsResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/TenantList'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    switchTenantResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/AuthResult'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    listSelfSessionsResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/SessionList'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    revokeSelfSessionResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Result'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    revokeOtherOwnSessionsResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/Result'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    enrollTotpResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/TotpEnrollment'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
    confirmTotpResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/RecoveryCodes'
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - data
      - meta
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: __Host-cleanops_session
    PreauthCookie:
      type: apiKey
      in: cookie
      name: __Host-cleanops_preauth
