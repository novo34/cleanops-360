  expected: 400 o 422 de schema; cero efectos
  requirements:
  - REQ-AUTH-042
  - REQ-AUTH-043
  - REQ-TEN-002
  - REQ-TEN-004
  parameters: []
  execution_status: NOT_EXECUTED_PRODUCT_TEST
