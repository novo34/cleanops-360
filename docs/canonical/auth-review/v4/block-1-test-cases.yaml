  layer: api+postgres+concurrency
  setup: Cookie válida y target ajeno/otro tenant/ausente
  action: DELETE /me/sessions/{session_id}
  expected: 404 equivalente sin revelar propietario ni mutar
  requirements:
  - REQ-AUTH-042
  - REQ-AUTH-043
  - REQ-TEN-002
  - REQ-TEN-004
  parameters: []
  execution_status: NOT_EXECUTED_PRODUCT_TEST
  environment: EPHEMERAL_SYNTHETIC_ONLY
